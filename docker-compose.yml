# Remote Connections Manager: web (nginx + SPA), api (Python), guacd.
# Runs the prebuilt images from the registry. PostgreSQL is EXTERNAL and configured through .env
# (DB_*). See docs/deployment.md.
#
#   cp .env.example .env   # fill in the mandatory values
#   docker compose pull && docker compose up -d
#
# Images: ${IMAGE_PREFIX}/remote-connections-manager-{web,api,guacd}:${IMAGE_TAG}
#   IMAGE_PREFIX  default ghcr.io/cmotec (a Gitea registry: <gitea-host>/<owner>)
#   IMAGE_TAG     default latest = newest release (or pin one: 1.2.0, 1.2, 1)
#
# Building from source instead: docker-compose.dev.yml.
# With a bundled PostgreSQL instead of an external one: docker-compose.postgres.yml.
# TLS: built in. HTTPS on HTTPS_PORT (default 8443) with a self-signed certificate, or your own
# tls.crt + tls.key in the certificate volume/TLS_CERT_DIR (docs/deployment.md, "TLS").

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:-ghcr.io/cmotec}/remote-connections-manager-web:${IMAGE_TAG:-latest}
    read_only: true
    # tmpfs mounts are root-owned by default; nginx runs as uid 101 and must write the rendered
    # config (conf.d), its pid file and temp files (/tmp), so make them writable explicitly.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /etc/nginx/conf.d:mode=1777
    environment:
      API_UPSTREAM: api:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-0}
      # TLS (always on): own certificate = tls.crt + tls.key in the certificate directory, otherwise a
      # self-signed one for the APP_URL host name is created there (docs/deployment.md, "TLS").
      APP_URL: ${APP_URL:-}
      TLS_SELF_SIGNED_NAME: ${TLS_SELF_SIGNED_NAME:-}
    ports:
      # HTTPS only (no plain-HTTP port)
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-8443}:8443"
    volumes:
      # a named volume by default; set TLS_CERT_DIR to a host directory (e.g. /srv/rcm/certs) to manage
      # the certificate files there
      - ${TLS_CERT_DIR:-web-certs}:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  api:
    <<: *hardening
    image: ${IMAGE_PREFIX:-ghcr.io/cmotec}/remote-connections-manager-api:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    # Optional so platforms that inject variables themselves (Arcane, Portainer, CI) work without a .env file.
    env_file:
      - path: .env
        required: false
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      # Only the web container talks to the API; trust its X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    # Exactly one replica: live sessions are held in this process (docs/limitations-and-risks.md).
    deploy:
      replicas: 1
    stop_grace_period: 30s
    depends_on:
      guacd:
        condition: service_healthy
    networks:
      - app
      - gateway

  guacd:
    <<: *hardening
    # Upstream guacd 1.6.0 plus /drives and /recordings owned by its user, so the named volumes are
    # created writable for guacd (see guacd/Dockerfile) without a root init container.
    image: ${IMAGE_PREFIX:-ghcr.io/cmotec}/remote-connections-manager-guacd:${IMAGE_TAG:-latest}
    # No published ports: guacd is reachable only from the api container (network "gateway").
    volumes:
      - drives:/drives
      - recordings:/recordings
      # Optional: CA bundle (system CAs + your internal CA) for RDP certificate validation, see docs/deployment.md
      # - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || (echo > /dev/tcp/127.0.0.1/4822) 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway

networks:
  app: {}
  gateway: {}

volumes:
  drives: {}
  recordings: {}
  web-certs: {}
