# Release images: built ONLY when a version tag (v1.2.3) is pushed, and only if the tagged commit is
# on main. Pushes to dev or main without a tag build nothing.
#
#   git checkout main && git merge dev && git push
#   git tag v1.2.3 && git push origin v1.2.3
#
# Each release gets the tags 1.2.3, 1.2, 1 and latest (latest only for final releases: a tag such as
# v1.3.0-rc1 gets 1.3.0-rc1 but does not move latest). "Run workflow" in the Actions tab rebuilds
# an existing tag.
#
# GitHub: works as is. Images go to ghcr.io/<owner>/remote-connections-manager-{api,web,guacd} using
#   the built-in GITHUB_TOKEN. New packages are private; make them public in the package settings.
#
# Gitea (Actions enabled, act_runner with Docker): same file (Gitea reads .github/workflows too).
#   Repository variables: REGISTRY = your Gitea host, e.g. git.example.com
#                         REGISTRY_USER = the account that owns the token (optional, default: actor)
#   Repository secret:    REGISTRY_TOKEN = access token with the "write:package" scope
#   Images go to <gitea-host>/<owner>/remote-connections-manager-{api,web,guacd}.
#
# Optional on both: IMAGE_NAMESPACE (default: repository owner), PLATFORMS (default: amd64 + arm64).

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, e.g. v1.2.3
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  check:
    name: Check release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      final: ${{ steps.release.outputs.final }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag is vX.Y.Z and on main
        id: release
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vMAJOR.MINOR.PATCH, e.g. v1.2.3)"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-list -n 1 "$tag")" origin/main; then
            echo "::error::'$tag' points to a commit that is not on main. Merge into main first, then tag main."
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # pre-releases (1.3.0-rc1) do not move "latest"
          if [[ "$version" == *-* ]]; then echo "final=false" >> "$GITHUB_OUTPUT"; else echo "final=true" >> "$GITHUB_OUTPUT"; fi

  image:
    name: ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: remote-connections-manager-api
            context: backend
          - image: remote-connections-manager-web
            context: frontend
          - image: remote-connections-manager-guacd
            context: guacd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Image name
        shell: bash
        run: |
          ns="${{ vars.IMAGE_NAMESPACE || github.repository_owner }}"
          # registries require lower-case repository names
          echo "IMAGE=${REGISTRY}/${ns,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }},enable=${{ needs.check.outputs.final }}
            type=semver,pattern={{major}},value=${{ needs.check.outputs.tag }},enable=${{ needs.check.outputs.final }}
            type=raw,value=latest,enable=${{ needs.check.outputs.final }}
          labels: |
            org.opencontainers.image.title=Remote Connections Manager
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.vendor=cmotec e.U.
            org.opencontainers.image.licenses=LicenseRef-Apache-2.0-with-Commons-Clause

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's build cache; Gitea runners build without it
          cache-from: ${{ vars.REGISTRY == '' && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ vars.REGISTRY == '' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
