# TLS termination inside the web container.
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Provide ./certs/tls.crt (full chain) and ./certs/tls.key, and set APP_URL=https://… and COOKIE_SECURE=true.
services:
  web:
    ports: !override
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./frontend/nginx/tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./certs/tls.key:/etc/nginx/certs/tls.key:ro
